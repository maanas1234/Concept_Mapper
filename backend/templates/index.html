<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Mapper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="brand">
            <span class="brand-dot"></span>
            Concept Mapper
        </div>
        <div class="nav-actions">
            <button class="nav-btn">Docs</button>
            <button class="nav-btn ghost">Changelog</button>
        </div>
    </nav>

    <div class="page">
        <section class="chat-panel">
            <header class="chat-header">
                <div class="title">
                    <span class="dot"></span>
                    Chat
                </div>
                <div class="sub">Ask anything; graph view on the right</div>
            </header>

            <div id="messages" class="messages" aria-live="polite"></div>

            <div class="input-dock">
                <div class="input-area">
                    <textarea id="msg" placeholder="Type a message..." rows="2"></textarea>
                    <button id="send-btn" onclick="sendMessage()">Send</button>
                </div>
                <div id="typing-indicator" class="typing-indicator hidden">AI is typing…</div>
            </div>
        </section>

        <section class="canvas-panel">
            <div class="canvas-placeholder">
                <div class="glass">
                    <p>3D canvas placeholder</p>
                    <small>Space reserved for the graph view</small>
                </div>
            </div>
        </section>
    </div>

    <!-- Node tooltip -->
    <div id="node-tooltip" style="
        display:none; position:fixed;
        background:rgba(15,15,25,0.92);
        border:1px solid rgba(255,255,255,0.15);
        border-radius:10px; padding:14px 18px;
        color:#fff; font-family:sans-serif; font-size:13px;
        max-width:240px; pointer-events:none; z-index:999;
        backdrop-filter:blur(8px);
        box-shadow:0 8px 32px rgba(0,0,0,0.4);
    ">
        <div id="tooltip-label" style="font-weight:700;font-size:15px;margin-bottom:6px;"></div>
        <div id="tooltip-desc"  style="color:rgba(255,255,255,0.7);line-height:1.5;"></div>
        <div id="tooltip-type"  style="margin-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.5;"></div>
    </div>

    <!-- Chat logic -->
    <script>
    const messagesEl = document.getElementById("messages");
    const inputEl    = document.getElementById("msg");
    const sendBtn    = document.getElementById("send-btn");
    const typingEl   = document.getElementById("typing-indicator");
    let isSending = false;

    function appendMessage(role, text) {
        const bubble = document.createElement("div");
        bubble.className = `message ${role}`;
        bubble.textContent = text;
        messagesEl.appendChild(bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setLoading(state) {
        isSending = state;
        sendBtn.disabled = state;
        typingEl.classList.toggle("hidden", !state);
        sendBtn.textContent = state ? "Sending…" : "Send";
    }

    function sendMessage() {
        if (isSending) return;
        const message = (inputEl.value || "").trim();
        if (!message) return;
        appendMessage("user", message);
        inputEl.value = "";
        inputEl.focus();
        setLoading(true);

        fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_input_field_name: message, session_id: "user1" })
        })
        .then(r => r.json())
        .then(data => {
            if (data.type === "graph") {
                appendMessage("ai", "Rendering your learning map...");
                renderGraph(data.graph);
            } else {
                appendMessage("ai", data.reply ?? data.message ?? "Received.");
            }
        })
        .catch(err => appendMessage("ai", `Error: ${err.message || err}`))
        .finally(() => setLoading(false));
    }

    inputEl.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    </script>

    <!-- Three.js graph -->
    <script>
    function getColor(type) {
        const map = { foundation:0x4f8eff, core:0xa78bfa, advanced:0x34d399, project:0xfb923c };
        return map[type] ?? 0xffffff;
    }

    function renderGraph(data) {
        const canvasPanel = document.querySelector(".canvas-panel");
        canvasPanel.innerHTML = "";

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a14);
        scene.fog = new THREE.FogExp2(0x0a0a14, 0.03);

        // Camera
        const camera = new THREE.PerspectiveCamera(75, canvasPanel.clientWidth / canvasPanel.clientHeight, 0.1, 1000);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(canvasPanel.clientWidth, canvasPanel.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        canvasPanel.appendChild(renderer.domElement);

        // Lights
        const pl1 = new THREE.PointLight(0xffffff, 1.5, 100);
        pl1.position.set(10, 10, 10);
        scene.add(pl1);
        const pl2 = new THREE.PointLight(0x4f8eff, 0.8, 80);
        pl2.position.set(-10, -5, -10);
        scene.add(pl2);
        scene.add(new THREE.AmbientLight(0x404060, 0.6));

        // ── Manual orbit (replaces OrbitControls) ──────────────────────────
        const orbit = {
            isDragging: false,
            prevX: 0, prevY: 0,
            theta: 0,
            phi: Math.PI / 2,
            radius: 15,
            autoRotate: true
        };

        function updateCamera() {
            camera.position.x = orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta);
            camera.position.y = orbit.radius * Math.cos(orbit.phi);
            camera.position.z = orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta);
            camera.lookAt(0, 0, 0);
        }
        updateCamera();

        const el = renderer.domElement;

        el.addEventListener("mousedown", e => {
            orbit.isDragging = true;
            orbit.autoRotate = false;
            orbit.prevX = e.clientX;
            orbit.prevY = e.clientY;
        });
        window.addEventListener("mouseup",   () => { orbit.isDragging = false; });
        window.addEventListener("mousemove", e => {
            if (!orbit.isDragging) return;
            orbit.theta -= (e.clientX - orbit.prevX) * 0.005;
            orbit.phi    = Math.max(0.1, Math.min(Math.PI - 0.1, orbit.phi - (e.clientY - orbit.prevY) * 0.005));
            orbit.prevX  = e.clientX;
            orbit.prevY  = e.clientY;
            updateCamera();
        });
        el.addEventListener("wheel", e => {
            orbit.radius = Math.max(4, Math.min(40, orbit.radius + e.deltaY * 0.02));
            updateCamera();
        });

        // Raycaster
        const raycaster   = new THREE.Raycaster();
        const mouse       = new THREE.Vector2();
        const nodeObjects = [];
        const nodeMap     = {};

        // Nodes
        data.nodes.forEach((node, i) => {
            const geo = new THREE.SphereGeometry(0.45, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: getColor(node.type),
                metalness: 0.4, roughness: 0.3,
                emissive: getColor(node.type),
                emissiveIntensity: 0.15
            });
            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.set(
                node.x * 2.2,
                node.y !== undefined ? node.y * 2.2 : (Math.random() - 0.5) * 5,
                node.z !== undefined ? node.z * 2.2 : (Math.random() - 0.5) * 5
            );
            sphere.userData = node;
            nodeObjects.push(sphere);
            scene.add(sphere);
            nodeMap[node.id] = sphere.position.clone();

            // Glow ring
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.55, 0.65, 32),
                new THREE.MeshBasicMaterial({
                    color: getColor(node.type),
                    side: THREE.DoubleSide,
                    transparent: true, opacity: 0.3
                })
            );
            ring.position.copy(sphere.position);
            ring.lookAt(camera.position);
            scene.add(ring);
        });

        // Edges
        data.edges.forEach(edge => {
            const from = nodeMap[edge.from], to = nodeMap[edge.to];
            if (!from || !to) return;
            scene.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([from, to]),
                new THREE.LineBasicMaterial({ color: 0x4a4a6a, transparent: true, opacity: 0.6 })
            ));
        });

        // Tooltip
        const tooltip      = document.getElementById("node-tooltip");
        const tooltipLabel = document.getElementById("tooltip-label");
        const tooltipDesc  = document.getElementById("tooltip-desc");
        const tooltipType  = document.getElementById("tooltip-type");

        el.addEventListener("mousemove", e => {
            if (orbit.isDragging) return;
            const rect = el.getBoundingClientRect();
            mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
            mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodeObjects);
            if (hits.length > 0) {
                const node = hits[0].object.userData;
                tooltipLabel.textContent = node.label;
                tooltipDesc.textContent  = node.description;
                tooltipType.textContent  = node.type;
                tooltip.style.display = "block";
                tooltip.style.left    = (e.clientX + 14) + "px";
                tooltip.style.top     = (e.clientY - 10) + "px";
                el.style.cursor = "pointer";
                hits[0].object.material.emissiveIntensity = 0.6;
            } else {
                tooltip.style.display = "none";
                el.style.cursor = "default";
                nodeObjects.forEach(o => o.material.emissiveIntensity = 0.15);
            }
        });

        // Resize
        window.addEventListener("resize", () => {
            camera.aspect = canvasPanel.clientWidth / canvasPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasPanel.clientWidth, canvasPanel.clientHeight);
        });

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            if (orbit.autoRotate) {
                orbit.theta += 0.003;
                updateCamera();
            }
            const t = Date.now() * 0.001;
            nodeObjects.forEach((obj, i) => {
                obj.position.y += Math.sin(t + i * 1.3) * 0.002;
            });
            renderer.render(scene, camera);
        }
        animate();
    }
    </script>
</body>
</html>
