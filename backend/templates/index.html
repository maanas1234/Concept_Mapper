<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Mapper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="brand">
            <span class="brand-dot"></span>
            Concept Mapper
        </div>
        <div class="nav-actions">
            <button class="nav-btn">Docs</button>
            <button class="nav-btn ghost">Changelog</button>
        </div>
    </nav>

    <div class="page">
        <section class="chat-panel">
            <header class="chat-header">
                <div class="title">
                    <span class="dot"></span>
                    Chat
                </div>
                <div class="sub">Ask anything; graph view on the right</div>
            </header>

            <div id="messages" class="messages" aria-live="polite"></div>

            <div class="input-dock">
                <div class="input-area">
                    <textarea id="msg" placeholder="Type a message..." rows="2"></textarea>
                    <button id="send-btn" onclick="sendMessage()">Send</button>
                </div>
                <div id="typing-indicator" class="typing-indicator hidden">AI is typing…</div>
            </div>
        </section>

        <section class="canvas-panel">
            <div class="canvas-placeholder">
                <div class="glass">
                    <p>3D canvas placeholder</p>
                    <small>Space reserved for the graph view</small>
                </div>
            </div>
        </section>
    </div>

    <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("msg");
    const sendBtn = document.getElementById("send-btn");
    const typingEl = document.getElementById("typing-indicator");
    let isSending = false;

    function appendMessage(role, text) {
        const bubble = document.createElement("div");
        bubble.className = `message ${role}`;
        bubble.textContent = text;
        messagesEl.appendChild(bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setLoading(state) {
        isSending = state;
        sendBtn.disabled = state;
        typingEl.classList.toggle("hidden", !state);
        sendBtn.textContent = state ? "Sending…" : "Send";
    }

    function sendMessage() {
        if (isSending) return;
        const message = (inputEl.value || "").trim();
        if (!message) return;

        appendMessage("user", message);
        inputEl.value = "";
        inputEl.focus();
        setLoading(true);

        fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_input_field_name: message,
                session_id:"user1"
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.type === "graph") {
        appendMessage("ai", "Rendering your learning map...");

        // for now just log
        console.log("GRAPH DATA:", data.graph);

        renderGraph(data.graph)
        } 
            else {
        const reply = data.reply ?? data.message ?? "Received.";
        appendMessage("ai", reply);
        }
        
        })
        .catch(err => {
            appendMessage("ai", `Error: ${err.message || err}`);
        })
        .finally(() => {
            setLoading(false);
        });
    }

    inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    </script>
    <script>
    function renderGraph(data) {
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const nodeObjects = [];
    const canvasPanel = document.querySelector(".canvas-panel");
    canvasPanel.innerHTML = "";
    sphere.userData = node; // 🔥 attach data
    nodeObjects.push(sphere);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        75,
        canvasPanel.clientWidth / canvasPanel.clientHeight,
        0.1,
        1000
    );
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(canvasPanel.clientWidth, canvasPanel.clientHeight);
    canvasPanel.appendChild(renderer.domElement);

    const nodeMap = {};

    // 🔵 NODES
    data.nodes.forEach(node => {
        const geometry = new THREE.SphereGeometry(0.4, 32, 32);

        const material = new THREE.MeshStandardMaterial({
            color: getColor(node.type),
            metalness: 0.3,
            roughness: 0.4
            });

        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(
            node.x * 2,
            (Math.random() - 0.5) * 4,
            (Math.random() - 0.5) * 4
);

        scene.add(sphere);

        nodeMap[node.id] = sphere.position;
    });

    // ⚪ EDGES
    data.edges.forEach(edge => {
        const points = [
            nodeMap[edge.from],
            nodeMap[edge.to]
        ];

        const geometry = new THREE.BufferGeometry().setFromPoints(points);

        const material = new THREE.LineBasicMaterial({ color: 0xffffff });

        const line = new THREE.Line(geometry, material);
        scene.add(line);
    });

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);

        controls.update(); // 🔥 IMPORTANT

        renderer.render(scene, camera);
        nodeObjects.forEach((obj, i) => {
        obj.position.y += Math.sin(Date.now() * 0.001 + i) * 0.002;
});
    }

    animate();
}
function getColor(type) {
    switch (type) {
        case "foundation": return 0x4f8eff;
        case "core": return 0xa78bfa;
        case "advanced": return 0x34d399;
        case "project": return 0xfb923c;
        default: return 0xffffff;
    }
}
const controls = new THREE.OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = true;
controls.enablePan = true;

renderer.domElement.addEventListener("click", (event) => {
    const rect = renderer.domElement.getBoundingClientRect();

    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(nodeObjects);

    if (intersects.length > 0) {
        const node = intersects[0].object.userData;

        showNodeInfo(node); // 🔥 call UI
    }
});
function showNodeInfo(node) {
    alert(
        `${node.label}\n\n${node.description}\n\nType: ${node.type}`
    );
}
const light = new THREE.PointLight(0xffffff, 1);
light.position.set(10, 10, 10);
scene.add(light);

const ambient = new THREE.AmbientLight(0x404040);
scene.add(ambient);

    </script>
</body>
</html>
