<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Mapper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="brand">
            <span class="brand-dot"></span>
            Concept Mapper
        </div>
        <div class="nav-actions">
            <button class="nav-btn">Docs</button>
            <button class="nav-btn ghost">Changelog</button>
        </div>
    </nav>

    <div class="page">
        <section class="chat-panel">
            <header class="chat-header">
                <div class="title"><span class="dot"></span>Chat</div>
                <div class="sub">Ask anything; graph view on the right</div>
            </header>
            <div id="messages" class="messages" aria-live="polite"></div>
            <div class="input-dock">
                <div class="input-area">
                    <textarea id="msg" placeholder="Type a message..." rows="2"></textarea>
                    <button id="send-btn" onclick="sendMessage()">Send</button>
                </div>
                <div id="typing-indicator" class="typing-indicator hidden">AI is typing…</div>
            </div>
        </section>

        <section class="canvas-panel"></section>
    </div>

    <!-- Rich node side panel -->
    <div id="node-panel" style="
        display:none; position:fixed; right:0; top:0;
        width:280px; height:100vh;
        background:rgba(17,24,39,0.97);
        border-left:1px solid rgba(255,255,255,0.1);
        padding:24px 20px; color:#fff;
        font-family:sans-serif; z-index:998;
        overflow-y:auto;
        backdrop-filter:blur(12px);
        box-shadow:-8px 0 32px rgba(0,0,0,0.5);
    ">
        <button onclick="document.getElementById('node-panel').style.display='none'" style="
            float:right; background:rgba(255,255,255,0.1);
            border:none; color:#fff; border-radius:6px;
            padding:4px 10px; cursor:pointer; font-size:13px; margin-bottom:8px;
        ">✕</button>
        <div id="panel-type"  style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.5;margin-bottom:8px;clear:both;"></div>
        <div id="panel-label" style="font-size:20px;font-weight:700;margin-bottom:10px;line-height:1.3;"></div>
        <div id="panel-desc"  style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:20px;"></div>

        <div id="panel-tasks-section" style="margin-bottom:16px;">
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.4;margin-bottom:8px;">What to do</div>
            <ul id="panel-tasks" style="margin:0;padding-left:16px;font-size:13px;color:rgba(255,255,255,0.75);line-height:1.9;"></ul>
        </div>

        <div id="panel-resources-section">
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.4;margin-bottom:8px;">Resources</div>
            <ul id="panel-resources" style="margin:0;padding-left:16px;font-size:13px;color:#4f8eff;line-height:1.9;"></ul>
        </div>
    </div>

    <!-- Hover tooltip -->
    <div id="node-tooltip" style="
        display:none; position:fixed;
        background:rgba(15,15,25,0.9);
        border:1px solid rgba(255,255,255,0.12);
        border-radius:8px; padding:8px 14px;
        color:#fff; font-family:sans-serif; font-size:13px;
        pointer-events:none; z-index:999;
        backdrop-filter:blur(8px);
    ">
        <span id="tooltip-label"></span>
        <span style="font-size:11px;opacity:.4;margin-left:6px;">click for details</span>
    </div>

    <!-- Camera hint -->
    <div id="cam-hint" style="
        display:none; position:fixed; bottom:16px; right:16px;
        font-family:sans-serif; font-size:11px;
        color:rgba(255,255,255,0.22); z-index:10; pointer-events:none;
    ">Left drag: rotate &nbsp;·&nbsp; Right drag: pan &nbsp;·&nbsp; Scroll: zoom</div>

    <!-- Chat -->
    <script>
    const messagesEl = document.getElementById("messages");
    const inputEl    = document.getElementById("msg");
    const sendBtn    = document.getElementById("send-btn");
    const typingEl   = document.getElementById("typing-indicator");
    let isSending = false;

    function appendMessage(role, text) {
        const b = document.createElement("div");
        b.className = `message ${role}`;
        b.textContent = text;
        messagesEl.appendChild(b);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function setLoading(state) {
        isSending = state;
        sendBtn.disabled = state;
        typingEl.classList.toggle("hidden", !state);
        sendBtn.textContent = state ? "Sending…" : "Send";
    }
    function sendMessage() {
        if (isSending) return;
        const message = (inputEl.value || "").trim();
        if (!message) return;
        appendMessage("user", message);
        inputEl.value = ""; inputEl.focus();
        setLoading(true);
        fetch("/chat", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ user_input_field_name: message, session_id:"user1" })
        })
        .then(r => r.json())
        .then(data => {
            if (data.type === "graph") {
                appendMessage("ai", "Rendering your learning map...");
                renderGraph(data.graph);
            } else {
                appendMessage("ai", data.reply ?? data.message ?? "Received.");
            }
        })
        .catch(err => appendMessage("ai", `Error: ${err.message || err}`))
        .finally(() => setLoading(false));
    }
    inputEl.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    </script>

    <!-- Three.js -->
    <script>
    function getColor(type) {
        return { foundation:0x4f8eff, core:0xa78bfa, advanced:0x34d399, project:0xfb923c }[type] ?? 0xffffff;
    }

    // ── Procedural node texture ───────────────────────────────────────────
    // Generates a canvas texture with noise-like detail so nodes look
    // like planets rather than plain coloured balls.
    function makeNodeTexture(hexColor) {
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext("2d");

        // Base colour
        const r = (hexColor >> 16) & 0xff;
        const g = (hexColor >> 8)  & 0xff;
        const b =  hexColor        & 0xff;

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(0, 0, size, size);

        // Latitude bands (lighter stripe)
        const grad = ctx.createLinearGradient(0, 0, 0, size);
        grad.addColorStop(0,    `rgba(255,255,255,0.08)`);
        grad.addColorStop(0.35, `rgba(255,255,255,0.18)`);
        grad.addColorStop(0.5,  `rgba(255,255,255,0.04)`);
        grad.addColorStop(0.65, `rgba(255,255,255,0.14)`);
        grad.addColorStop(1,    `rgba(0,0,0,0.15)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        // Noise blobs — give it that planet surface feel
        const seed = hexColor; // deterministic per colour
        for (let i = 0; i < 120; i++) {
            const px = ((Math.sin(seed * i * 0.0013) * 0.5 + 0.5)) * size;
            const py = ((Math.cos(seed * i * 0.0017) * 0.5 + 0.5)) * size;
            const radius = 4 + (i % 7) * 3;
            const alpha  = 0.04 + (i % 5) * 0.015;
            const light  = i % 2 === 0;
            ctx.beginPath();
            ctx.arc(px, py, radius, 0, Math.PI * 2);
            ctx.fillStyle = light
                ? `rgba(255,255,255,${alpha})`
                : `rgba(0,0,0,${alpha * 1.5})`;
            ctx.fill();
        }

        // Subtle vignette at poles
        const vign = ctx.createRadialGradient(size/2, size/2, size*0.3, size/2, size/2, size*0.7);
        vign.addColorStop(0, "rgba(0,0,0,0)");
        vign.addColorStop(1, "rgba(0,0,0,0.3)");
        ctx.fillStyle = vign;
        ctx.fillRect(0, 0, size, size);

        const tex = new THREE.CanvasTexture(canvas);
        return tex;
    }

    function renderGraph(data) {
        const canvasPanel = document.querySelector(".canvas-panel");
        canvasPanel.innerHTML = "";
        document.getElementById("cam-hint").style.display = "block";

        // ── Normalize node positions to always fit in view ─────────────
        // The AI gives arbitrary coords — we remap them to a fixed range
        // so nodes are always visible regardless of what values it returns.
        const xs = data.nodes.map(n => n.x || 0);
        const ys = data.nodes.map(n => n.y || 0);
        const zs = data.nodes.map(n => n.z || 0);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        const minZ = Math.min(...zs), maxZ = Math.max(...zs);

        function remap(val, min, max, outRange) {
            if (max === min) return (Math.random() - 0.5) * outRange;
            return ((val - min) / (max - min) - 0.5) * outRange;
        }

        data.nodes = data.nodes.map(n => ({
            ...n,
            nx: remap(n.x || 0, minX, maxX, 22),  // was 12 — wider spread
            ny: remap(n.y || 0, minY, maxY, 14) + (Math.random() - 0.5) * 4,
            nz: remap(n.z || 0, minZ, maxZ, 14) + (Math.random() - 0.5) * 5,
        }));

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111827); // dark blue-grey, easier on eyes
        scene.fog = new THREE.FogExp2(0x111827, 0.018);

        // Camera
        const camera = new THREE.PerspectiveCamera(75, canvasPanel.clientWidth / canvasPanel.clientHeight, 0.1, 1000);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(canvasPanel.clientWidth, canvasPanel.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        canvasPanel.appendChild(renderer.domElement);
        renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());

        // Lights
        const pl1 = new THREE.PointLight(0xffffff, 1.5, 100); pl1.position.set(10,10,10); scene.add(pl1);
        const pl2 = new THREE.PointLight(0x4f8eff, 0.8, 80);  pl2.position.set(-10,-5,-10); scene.add(pl2);
        scene.add(new THREE.AmbientLight(0x404060, 0.6));

        // ── Camera state ──────────────────────────────────────────────────
        const cam = {
            theta: 0, phi: Math.PI / 2, radius: 28,  // was 18
            panX: 0,  panY: 0,
            autoRotate: true,
            dragging: false, button: 0, px: 0, py: 0
        };

        function updateCamera() {
            camera.position.set(
                cam.panX + cam.radius * Math.sin(cam.phi) * Math.sin(cam.theta),
                cam.panY + cam.radius * Math.cos(cam.phi),
                         cam.radius * Math.sin(cam.phi) * Math.cos(cam.theta)
            );
            camera.lookAt(cam.panX, cam.panY, 0);
        }
        updateCamera();

        const el = renderer.domElement;

        el.addEventListener("mousedown", e => {
            cam.dragging = true;
            cam.button   = e.button;
            cam.px = e.clientX; cam.py = e.clientY;
            if (e.button === 0) cam.autoRotate = false;
        });
        window.addEventListener("mouseup",   () => cam.dragging = false);
        window.addEventListener("mousemove", e => {
            if (!cam.dragging) return;
            const dx = e.clientX - cam.px;
            const dy = e.clientY - cam.py;
            cam.px = e.clientX; cam.py = e.clientY;
            if (cam.button === 0) {
                // Rotate
                cam.theta -= dx * 0.005;
                cam.phi    = Math.max(0.1, Math.min(Math.PI - 0.1, cam.phi - dy * 0.005));
            } else if (cam.button === 2) {
                // Pan
                const s = cam.radius * 0.0008;
                cam.panX -= dx * s;
                cam.panY += dy * s;
            }
            updateCamera();
        });
        el.addEventListener("wheel", e => {
            cam.radius = Math.max(4, Math.min(50, cam.radius + e.deltaY * 0.03));
            updateCamera();
        });

        // Nodes + edges
        const raycaster   = new THREE.Raycaster();
        const mousePick   = new THREE.Vector2();
        const nodeObjects = [];
        const nodeMap     = {};

        const pulseRings = [];

        data.nodes.forEach((node, i) => {
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.75, 32, 32),
                new THREE.MeshStandardMaterial({
                    map: makeNodeTexture(getColor(node.type)),
                    color: getColor(node.type),
                    metalness: 0.2,
                    roughness: 0.65,
                    emissive: getColor(node.type),
                    emissiveIntensity: 0.3
                })
            );
            sphere.position.set(node.nx, node.ny, node.nz);
            sphere.userData = { ...node, index: i };
            nodeObjects.push(sphere);
            scene.add(sphere);
            nodeMap[node.id] = sphere.position.clone();

            // Static glow ring
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.9, 1.05, 32),
                new THREE.MeshBasicMaterial({ color: getColor(node.type), side:THREE.DoubleSide, transparent:true, opacity:0.35 })
            );
            ring.position.copy(sphere.position);
            ring.lookAt(camera.position);
            scene.add(ring);

            // Animated pulse ring — expands and fades
            const pulseRing = new THREE.Mesh(
                new THREE.RingGeometry(0.78, 0.95, 32),
                new THREE.MeshBasicMaterial({
                    color: getColor(node.type), side: THREE.DoubleSide,
                    transparent: true, opacity: 0.6
                })
            );
            pulseRing.position.copy(sphere.position);
            pulseRing.lookAt(camera.position);
            pulseRing.userData.phase = i * (Math.PI * 2 / data.nodes.length); // stagger
            scene.add(pulseRing);
            pulseRings.push(pulseRing);

            // START NODE — first node gets a bright double-halo crown
            if (i === 0) {
                sphere.scale.set(1.3, 1.3, 1.3);

                [{ r1:1.15, r2:1.28, op:0.6 }, { r1:1.4, r2:1.48, op:0.25 }].forEach(h => {
                    const halo = new THREE.Mesh(
                        new THREE.RingGeometry(h.r1, h.r2, 32),
                        new THREE.MeshBasicMaterial({
                            color: 0xffffff, side: THREE.DoubleSide,
                            transparent: true, opacity: h.op
                        })
                    );
                    halo.position.copy(sphere.position);
                    halo.lookAt(camera.position);
                    scene.add(halo);
                });
            }
        });

        data.edges.forEach(edge => {
            const from = nodeMap[edge.from], to = nodeMap[edge.to];
            if (!from || !to) return;
            scene.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([from, to]),
                new THREE.LineBasicMaterial({ color:0x4a4a6a, transparent:true, opacity:0.6 })
            ));
        });

        // Tooltip (hover)
        const tooltip      = document.getElementById("node-tooltip");
        const tooltipLabel = document.getElementById("tooltip-label");

        // Side panel (click)
        const panel    = document.getElementById("node-panel");
        const pType    = document.getElementById("panel-type");
        const pLabel   = document.getElementById("panel-label");
        const pDesc    = document.getElementById("panel-desc");
        const pTasks   = document.getElementById("panel-tasks");
        const pRes     = document.getElementById("panel-resources");
        const pTaskSec = document.getElementById("panel-tasks-section");
        const pResSec  = document.getElementById("panel-resources-section");

        el.addEventListener("mousemove", e => {
            if (cam.dragging) { tooltip.style.display = "none"; return; }
            const rect = el.getBoundingClientRect();
            mousePick.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
            mousePick.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
            raycaster.setFromCamera(mousePick, camera);
            const hits = raycaster.intersectObjects(nodeObjects);
            if (hits.length > 0) {
                tooltipLabel.textContent = hits[0].object.userData.label;
                tooltip.style.display = "block";
                tooltip.style.left = (e.clientX + 14) + "px";
                tooltip.style.top  = (e.clientY - 10) + "px";
                el.style.cursor = "pointer";
                hits[0].object.material.emissiveIntensity = 0.8;
            } else {
                tooltip.style.display = "none";
                el.style.cursor = "default";
                nodeObjects.forEach(o => o.material.emissiveIntensity = 0.3);
            }
        });

        el.addEventListener("click", e => {
            const rect = el.getBoundingClientRect();
            mousePick.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
            mousePick.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
            raycaster.setFromCamera(mousePick, camera);
            const hits = raycaster.intersectObjects(nodeObjects);
            if (hits.length === 0) return;
            const node = hits[0].object.userData;

            pType.textContent  = node.type + (node.index === 0 ? " · START" : "");
            pLabel.textContent = node.label;
            pDesc.textContent  = node.description;

            pTasks.innerHTML = "";
            const tasks = Array.isArray(node.tasks) ? node.tasks : [];
            tasks.forEach(t => { const li = document.createElement("li"); li.textContent = t; pTasks.appendChild(li); });
            pTaskSec.style.display = tasks.length ? "block" : "none";

            pRes.innerHTML = "";
            const resources = Array.isArray(node.resources) ? node.resources : [];
            resources.forEach(r => {
                const li = document.createElement("li");
                // Check if it looks like a URL
                const isUrl = r.match(/https?:\/\//i);
                if (isUrl) {
                    const a = document.createElement("a");
                    a.href = r; a.target = "_blank"; a.rel = "noopener";
                    a.textContent = r;
                    a.style.cssText = "color:#4f8eff;text-decoration:none;word-break:break-all;";
                    a.onmouseover = () => a.style.textDecoration = "underline";
                    a.onmouseout  = () => a.style.textDecoration = "none";
                    li.appendChild(a);
                } else {
                    // Not a raw URL — still make it searchable on click
                    const a = document.createElement("a");
                    a.href = `https://www.google.com/search?q=${encodeURIComponent(r)}`;
                    a.target = "_blank"; a.rel = "noopener";
                    a.textContent = r;
                    a.style.cssText = "color:#4f8eff;text-decoration:none;cursor:pointer;";
                    a.onmouseover = () => a.style.textDecoration = "underline";
                    a.onmouseout  = () => a.style.textDecoration = "none";
                    li.appendChild(a);
                }
                pRes.appendChild(li);
            });
            pResSec.style.display = resources.length ? "block" : "none";

            panel.style.display = "block";
        });

        // Resize
        window.addEventListener("resize", () => {
            camera.aspect = canvasPanel.clientWidth / canvasPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasPanel.clientWidth, canvasPanel.clientHeight);
        });

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            if (cam.autoRotate) { cam.theta += 0.003; updateCamera(); }

            const t = Date.now() * 0.001;

            // Bob nodes up/down
            nodeObjects.forEach((obj, i) => {
                obj.position.y += Math.sin(t * 1.1 + i * 1.3) * 0.002;
            });

            // Pulse rings — expand scale and fade opacity in a loop
            pulseRings.forEach((ring, i) => {
                const cycle = (t * 0.8 + ring.userData.phase) % (Math.PI * 2);
                const progress = cycle / (Math.PI * 2); // 0 → 1
                const s = 1 + progress * 1.4;           // scale 1x → 2.4x
                ring.scale.set(s, s, 1);
                ring.material.opacity = 0.55 * (1 - progress); // fade out
            });

            renderer.render(scene, camera);
        }
        animate();
    }
    </script>
</body>
</html>
